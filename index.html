<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070d" />

      name="description"
      content="AceMusic AI — standalone interactive music studio with a cursor-tracking robot and a real WAV/MP3 player."

    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("acemusic.spline.settings.v1") || "{}");
        if (saved.theme) document.documentElement.dataset.theme = saved.theme;
      } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
